[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mlforge"
version = "1.0.0"
description = "Production Machine Learning Pipeline Builder and Systems Management Platform"
authors = [{ name = "ML Systems Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "werkzeug>=3.0.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --durations=10"
testpaths = [
    "tests",
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
