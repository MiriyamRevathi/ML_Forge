{% extends "base.html" %}

{% block title %}Upload Dataset — MLForge{% endblock %}
{% block page_title %}Upload New Dataset CSV File{% endblock %}

{% block content %}
<div class="dataset-upload-page">
    <div class="card" style="max-width: 600px; margin: 0 auto;">
        <div class="card-header">
            <h3>📁 CSV Dataset Ingestion Form</h3>
            <a href="{{ url_for('datasets.index') }}" class="btn btn-sm btn-secondary">← Cancel</a>
        </div>

        <form action="{{ url_for('datasets.upload') }}" method="POST" enctype="multipart/form-data" class="upload-form" style="margin-top: 1.5rem;">
            <div class="form-group">
                <label for="name" class="form-label">Dataset Name *</label>
                <input type="text" id="name" name="name" class="form-control" placeholder="e.g. Customer Churn Q3" required>
            </div>

            <div class="form-group" style="margin-top: 1rem;">
                <label for="description" class="form-label">Description / Business Context</label>
                <textarea id="description" name="description" class="form-control" rows="3" placeholder="Brief context about features, target variable, and business domain..."></textarea>
            </div>

            <div class="form-group" style="margin-top: 1rem;">
                <label for="target_column" class="form-label">Target Column Name (Optional)</label>
                <input type="text" id="target_column" name="target_column" class="form-control" placeholder="e.g. churned or house_price">
            </div>

            <div class="form-group" style="margin-top: 1rem;">
                <label for="task_type" class="form-label">ML Task Type</label>
                <select id="task_type" name="task_type" class="form-control">
                    <option value="classification">Classification (Categorical / Binary Target)</option>
                    <option value="regression">Regression (Continuous Numerical Target)</option>
                </select>
            </div>

            <div class="form-group" style="margin-top: 1rem;">
                <label for="file" class="form-label">Select CSV File *</label>
                <input type="file" id="file" name="file" accept=".csv" class="form-control" required>
            </div>

            <div style="margin-top: 2rem; display: flex; justify-content: flex-end; gap: 1rem;">
                <a href="{{ url_for('datasets.index') }}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">⚡ Ingest Dataset</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
